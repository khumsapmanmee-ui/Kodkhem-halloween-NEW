*{box-sizing:border-box}html{background:#170e22}body{margin:0;color:#fff;font-family:system-ui,'Noto Sans Thai',sans-serif;background:radial-gradient(circle at 50% 12%,#71387b,#2b173f 55%,#170e22);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}main{max-width:560px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:12px}.heading{text-align:center}.label{font-weight:900;color:#ffcb78;letter-spacing:1.5px;font-size:13px}.logo{display:block;width:154px;height:116px;object-fit:contain;margin:4px auto 0;background:white;border-radius:16px;border:3px solid #e7b775;padding:3px}.tag{font-size:13px;color:#e8d2ee;margin-top:4px}.arena{position:relative;flex:1;min-height:300px;background:linear-gradient(155deg,#53316d,#2b183d);border:2px solid #9966ad;border-radius:26px;padding:16px 10px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 8px 28px #0007;overflow:hidden}.pointer{font-size:30px;line-height:1;color:#ffe6a0;z-index:2;text-shadow:0 3px 6px #000}.wheel{position:relative;width:min(65vw,260px);height:min(65vw,260px);border-radius:50%;border:8px solid #ffbb50;box-shadow:0 0 0 5px #8a547a,0 0 30px #ff9c4b70;background:conic-gradient(from -180deg,#8c48c3 0 25%,#f39c2f 25% 50%,#0aa993 50% 75%,#e5599a 75% 100%);transition:transform 3.6s cubic-bezier(.13,.72,.15,1);flex-shrink:0}.sector{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 5px #0009;font-size:26px;line-height:1.15}.sector small{font-size:11px;font-weight:900}.s1{left:18%;top:19%}.s2{right:18%;top:19%}.s3{right:18%;bottom:19%}.s4{left:18%;bottom:19%}.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#ffdc8d;border:5px solid #99521b;font-size:24px}.headline{text-align:center;color:#ffd5 ze:16px}.headline{margin-top:8px}.stock{padding:9px}.prize{margin:6px 0}}

/* KODKHEM kawaii Halloween redesign */
body{background:radial-gradient(circle at 50% 4%,#fff0ac55 0 9%,transparent 29%),radial-gradient(circle at 20% 30%,#a76bcd60,transparent 40%),linear-gradient(180deg,#4d276d 0%,#28133e 53%,#180e2c 100%)}
main{max-width:520px;gap:10px;padding-left:12px;padding-right:12px}
.heading{position:relative;padding-top:6px}
.heading:before{content:'🦇  ✦  🦇';position:absolute;left:0;top:6px;font-size:20px;opacity:.75}
.heading:after{content:'🌙';position:absolute;right:5px;top:0;font-size:42px;filter:drop-shadow(0 0 12px #ffcf84)}
.logo{width:144px;height:102px;border-radius:22px;border:5px solid #f9d5a0;box-shadow:0 5px 0 #ab6d63,0 9px 22px #0007;margin:2px auto 6px}
.label{font-size:clamp(25px,7.4vw,39px);line-height:1.07;color:#ffa940;letter-spacing:1px;text-shadow:2px 4px 0 #7e2b5c,-1px -1px #ffe1a1,0 5px 18px #ff9b32;font-weight:1000}
.label span{color:#fff2d4;font-size:.78em;text-shadow:2px 3px 0 #8a4888}
.ghostline{margin:5px auto;color:#fff5d9;font-size:17px}
.tag{display:inline-block;background:#ef9c54;color:#36182f;font-weight:900;padding:7px 17px;border-radius:30px;border:2px solid #ffdb9a;box-shadow:0 3px 0 #a95e4b;margin-top:3px}
.arena{border:3px solid #e5a76a;background:radial-gradient(circle at 50% 35%,#9a59ba,#522d74 57%,#301940);border-radius:35px;min-height:315px;box-shadow:0 8px 0 #532446,0 12px 24px #0008,inset 0 0 40px #f4b47c25}
.arena:before{content:'✦    🦇    ✨    🦇    ✦';position:absolute;top:12px;color:#ffd2a3;opacity:.75}
.cuteghost{position:absolute;font-size:38px;filter:drop-shadow(0 5px 4px #0005);z-index:1;pointer-events:none}
.cuteghost.left{left:5px;top:32%}.cuteghost.right{right:5px;top:57%}
.pointer{color:#fff3c6;text-shadow:0 3px 0 #b57c49;font-size:32px}
.wheel{border:10px solid #ffc96c;box-shadow:0 0 0 6px #9a5d7b,0 0 0 10px #edb676,0 0 36px #ffba6490;background:conic-gradient(from -180deg,#b987eb 0 25%,#ffb65e 25% 50%,#6bd4b3 50% 75%,#ff92b4 75% 100%)}
.sector{font-size:29px;text-shadow:0 2px 3px #41203980}.sector small{color:#30172f;text-shadow:0 1px #fff7;font-size:11px}
.hub{background:#ffe9b8;border-color:#ac6b42}
.headline{color:#fff0bf;text-shadow:0 2px 0 #9b5c68;font-size:clamp(20px,5.4vw,26px)}
.detail{color:#fff3e8}
.button{background:linear-gradient(#ffe99c,#ffab4d 55%,#ff8b37);border:3px solid #ffe6a7;box-shadow:0 6px 0 #a75d42,0 9px 18px #0005;border-radius:28px;color:#4b2236}
.stock{background:#42243e;border:2px solid #bd7b8a;box-shadow:0 5px 0 #2a142e;border-radius:23px}
.stocktop b{color:#ffe09b}
.smallbtn{background:#775075;border:2px solid #c79cb1;border-radius:16px}
@media(max-height:760px){.logo{height:75px;width:105px}.label{font-size:24px}.ghostline{display:none}.arena{min-height:240px}.cuteghost{font-size:25px}.tag{font-size:11px;padding:4px 12px}}
</style></head><body><main><header class="heading"><img class="logo" src="logo.jpg" alt="โลโก้ร้านโคตรเข้ม"><div class="label">🎃 HALLOWEEN<br><span>LUCKY DRAW</span> 🎃</div><div class="ghostline">👻 ✨ 🧡 ✨ 👻</div><div class="tag">ทุกยอดซื้อครบ 100 บาท รับ 1 สิทธิ์</div></header><section class="arena"><div class="cuteghost left">👻</div><div class="cuteghost right">🎃</div><div id="confetti" class="confetti"></div><div class="pointer">▼</div><div class="wheel" id="wheel"><div class="sector s1">🥤<small>แก้วเย็น</small></div><div class="sector s2">🎟️<small>ลด 5฿</small></div><div class="sector s3">🧋<small>น้ำฟรี</small></div><div class="sector s4">🎁<small>ลด 10฿</small></div><div class="hub">☕</div></div><div class="headline" id="headline">พร้อมลุ้นโชคสุดหลอน!</div><div class="detail" id="detail">กดปุ่มด้านล่างเพื่อสุ่มรางวัล</div></section><button class="button" id="draw">🎃 เริ่มหมุน! ลุ้นรางวัล 🎁</button><section class="stock"><div class="stocktop"><span>🎁 รางวัลสุดคิวต์คงเหลือ</span><b id="total">100 / 100</b></div><div id="prizes"></div></section><div class="bottom"><span class="status" id="status">● พร้อมสุ่ม</span><button class="smallbtn" id="staff">🔒 สำหรับพนักงาน</button></div></main>
<dialog id="auth"><h3 id="authTitle">พนักงาน</h3><p id="authDesc"></p><input id="pin" type="password" inputmode="numeric" placeholder="PIN 4–8 หลัก" autocomplete="off"><div id="error" class="error"></div><button class="button dialogbutton" id="authOK">ยืนยัน</button><button class="smallbtn dialogbutton" id="authClose">ปิด</button></dialog><dialog id="admin"><h3>⚙️ จัดการรางวัล</h3><p id="summary"></p><div class="history" id="history"></div><button class="button dialogbutton" id="next">✅ อนุญาตลูกค้าคนถัดไป</button><button class="smallbtn dialogbutton" id="pinChange">เปลี่ยน PIN</button><button class="smallbtn dialogbutton" id="reset">รีเซ็ตรางวัลและลบประวัติ</button><button class="smallbtn dialogbutton" id="adminClose">ปิด</button></dialog>
<script>
'use strict';const KEY='kodkhem_samsung_halloween_v1',INITIAL=[10,60,20,10],P=[{name:'แก้วเก็บความเย็น',emoji:'🥤',color:'#b58bff'},{name:'ส่วนลด 5 บาทในบิลถัดไป',emoji:'🎟️',color:'#ffad4b'},{name:'ส่วนลด 10 บาทในบิลถัดไป',emoji:'🎁',color:'#f57daf'},{name:'โอ๊ย..ตกใจหมด! รับน้ำฟรี 1 แก้ว',emoji:'🧋',color:'#65d7b5'}];const $=id=>document.getElementById(id);function fresh(){return {v:2,stock:[...INITIAL],history:[],locked:false,pin:''}}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1&&Array.isArray(d.stock)&&d.stock.length===4&&d.stock[1]<=30){d.stock[1]+=30;d.v=2;localStorage.setItem(KEY,JSON.stringify(d))}if(d&&d.v===2&&Array.isArray(d.stock)&&d.stock.length===4&&d.stock.every((n,i)=>Number.isInteger(n)&&n>=0&&n<=INITIAL[i])&&Array.isArray(d.history)&&typeof d.locked==='boolean'&&typeof d.pin==='string')return d}catch(e){}return fresh()}let data=load(),spinning=false,rotation=0;const remaining=()=>data.stock.reduce((a,b)=>a+b,0);function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('บันทึกข้อมูลไม่สำเร็จ ห้ามสุ่มต่อ กรุณาตรวจสอบพื้นที่จัดเก็บ');return false}}function render(){let n=remaining();$('total').textContent=n+' / 100';$('prizes').innerHTML=P.map((p,i)=>`<div class="prize"><div class="prizerow"><span>${p.emoji} ${p.name}</span><b>${data.stock[i]} / ${INITIAL[i]}</b></div><div class="track"><div class="fill" style="width:${data.stock[i]/INITIAL[i]*100}%;background:${p.color}"></div></div></div>`).join('');$('draw').disabled=spinning||data.locked||n===0;$('draw').textContent=spinning?'🎃 กำลังสุ่ม...':data.locked?'🔒 รอพนักงานยืนยัน':n===0?'🎉 รางวัลหมดแล้ว':'🎃 เริ่มหมุน! ลุ้นรางวัล 🎁';$('status').textContent=n===0?'● แจกรางวัลครบแล้ว':data.locked?'● ต้องให้พนักงานยืนยัน':'● พร้อมสุ่ม'}function show(h,d){$('headline').textContent=h;$('detail').textContent=d}function rand(max){const a=new Uint32Array(1),lim=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}function choose(){let n=rand(remaining());for(let i=0;i<4;i++){if(n<data.stock[i])return i;n-=data.stock[i]}}function confetti(){const c=$('confetti');c.replaceChildren();for(let i=0;i<28;i++){const e=document.createElement('i');e.textContent=['🎉','✨','🎃','⭐'][i%4];e.style.left=(Math.random()*100)+'%';e.style.animationDelay=(Math.random()*.7)+'s';c.append(e)}setTimeout(()=>c.replaceChildren(),3300)}$('draw').onclick=()=>{if(spinning||data.locked||!remaining())return;spinning=true;render();show('🎃 ผีกำลังเลือกรางวัล...','ลุ้นกันอีกนิด!');const i=choose();const angles=[315,45,225,135];/* conic gradient quadrants: top-left,top-right,bottom-right,bottom-left; wheel labels match */const desired=(360-angles[i]+360)%360;const cur=((rotation%360)+360)%360;rotation+=1800+((desired-cur+360)%360);$('wheel').style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{const previous=structuredClone(data);data.stock[i]--;data.locked=true;data.history.unshift({prize:i,at:new Date().toLocaleString('th-TH')});if(!save()){data=previous;spinning=false;render();show('บันทึกไม่สำเร็จ','แจ้งพนักงานก่อนสุ่มอีกครั้ง');return}spinning=false;show('🎉 ยินดีด้วย!',P[i].name);confetti();render()},3700)};
function authOpen(){$('authTitle').textContent=data.pin?'🔒 รหัสพนักงาน':'🔒 ตั้งรหัสพนักงานครั้งแรก';$('authDesc').textContent=data.pin?'ใส่ PIN เพื่อเปิดเมนูจัดการ':'ตั้ง PIN ตัวเลข 4–8 หลัก และจดเก็บไว้';$('pin').value='';$('error').textContent='';$('auth').showModal()}$('staff').onclick=authOpen;$('authClose').onclick=()=>$('auth').close();$('authOK').onclick=()=>{const pin=$('pin').value;if(!data.pin){if(!/^\d{4,8}$/.test(pin)){$('error').textContent='ใช้ตัวเลข 4–8 หลัก';return}data.pin=pin;if(!save())return}else if(pin!==data.pin){$('error').textContent='รหัส PIN ไม่ถูกต้อง';return}$('auth').close();adminOpen()};function adminOpen(){$('summary').textContent=`แจกแล้ว ${100-remaining()} ครั้ง | คงเหลือ ${remaining()} ครั้ง`;$('history').replaceChildren();data.history.slice(0,40).forEach((x,i)=>{const e=document.createElement('p');e.textContent=`${data.history.length-i}. ${P[x.prize].name} — ${x.at}`;$('history').append(e)});$('next').disabled=!data.locked||!remaining();$('admin').showModal()}$('next').onclick=()=>{data.locked=false;if(!save()){data.locked=true;return}$('admin').close();show('พร้อมลุ้นโชคสุดหลอน!','กดปุ่มด้านล่างเพื่อสุ่มรางวัล');render()};$('pinChange').onclick=()=>{const p=prompt('ตั้ง PIN ใหม่ (ตัวเลข 4–8 หลัก)');if(p===null)return;if(!/^\d{4,8}$/.test(p)){alert('PIN ต้องเป็นตัวเลข 4–8 หลัก');return}data.pin=p;if(save())alert('เปลี่ยน PIN แล้ว')};$('reset').onclick=()=>{if(!confirm('จะลบประวัติและคืนรางวัลทั้งหมดเป็น 100 ครั้ง ใช่หรือไม่?'))return;if(prompt('พิมพ์ RESET เพื่อยืนยัน')!=='RESET')return;const old=data;data=fresh();data.pin=old.pin;if(!save()){data=old;return}$('admin').close();show('พร้อมลุ้นโชคสุดหลอน!','เริ่มกิจกรรมใหม่แล้ว');render()};$('adminClose').onclick=()=>$('admin').close();if(data.locked){const x=data.history[0];show('🎉 สุ่มรางวัลแล้ว',x?P[x.prize].name:'รอพนักงานยืนยัน')}if(!remaining())show('🎉 แจกรางวัลครบแล้ว!','ขอบคุณที่ร่วมสนุกกับโคตรเข้ม');render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
